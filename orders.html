<style>
:root{
  --ink:#0a0b0d; --panel:#131519; --line:#26292f;
  --bone:#f4f2ec; --bone-dim:#a8a9ab; --volt:#d7ff3f;
  --red-signal:#ff3b30; --green-ok:#37d67a;
  --font-display:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--ink); color:var(--bone); font-family:var(--font-body); line-height:1.5;}
a{color:inherit;}

.wrap{max-width:800px; margin:0 auto; padding:24px 18px 80px;}
header{
  display:flex; justify-content:space-between; align-items:center;
  padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:24px;
}
.logo{font-family:var(--font-display); font-size:22px; text-transform:uppercase;}
.logo .accent{color:var(--volt);}
.status-dot{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px; color:var(--bone-dim);
}
.status-dot .dot{width:8px; height:8px; border-radius:50%; background:var(--green-ok);}

.lock-screen{max-width:340px; margin:16vh auto; text-align:center;}
.lock-screen h2{font-family:var(--font-display); font-size:26px; text-transform:uppercase; margin-bottom:18px;}
.lock-screen input{
  width:100%; padding:14px; background:var(--panel); border:1px solid var(--line);
  color:var(--bone); border-radius:2px; font-size:15px; margin-bottom:14px; text-align:center;
  letter-spacing:0.2em;
}
.lock-screen input:focus{outline:none; border-color:var(--volt);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 24px; font-weight:700; font-size:13px;
  text-transform:uppercase; letter-spacing:0.05em;
  border-radius:2px; border:none; cursor:pointer;
  background:var(--volt); color:var(--ink); width:100%;
}
.btn:hover{background:var(--bone);}

.stat-row{display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;}
.stat-box{
  flex:1; min-width:120px; background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:16px;
}
.stat-box .num{font-family:var(--font-display); font-size:24px; color:var(--volt);}
.stat-box .label{font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; color:var(--bone-dim); margin-top:4px; text-transform:uppercase;}

.order-card{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:18px; margin-bottom:14px; position:relative;
}
.order-card.unpaid{border-left:3px solid var(--red-signal);}
.order-card.paid{border-left:3px solid var(--green-ok);}
.order-card.new-flash{animation:flash 1.8s ease;}
@keyframes flash{
  0%{background:rgba(215,255,63,0.18);}
  100%{background:var(--panel);}
}
.order-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px;}
.order-code{font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--volt);}
.order-time{font-family:var(--font-mono); font-size:10px; color:var(--bone-dim);}
.order-status{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  padding:4px 10px; border-radius:100px; white-space:nowrap;
}
.order-status.unpaid{background:rgba(255,59,48,0.15); color:var(--red-signal);}
.order-status.paid{background:rgba(55,214,122,0.15); color:var(--green-ok);}

.order-customer{font-size:15px; font-weight:700; margin-bottom:2px;}
.order-detail{font-size:13px; color:var(--bone-dim); margin-bottom:2px;}
.order-items{
  margin:12px 0; padding:12px; background:var(--ink); border-radius:4px; font-size:13px;
}
.order-items div{margin-bottom:4px;}
.order-total-row{
  display:flex; justify-content:space-between; margin-top:10px;
  font-family:var(--font-mono); font-size:14px; font-weight:800; color:var(--volt);
}
.order-actions{display:flex; gap:8px; margin-top:12px;}
.action-btn{
  flex:1; padding:9px; font-size:11px; font-family:var(--font-mono);
  border:1px solid var(--line); border-radius:2px; background:var(--ink); color:var(--bone);
  cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;
}
.action-btn:hover{border-color:var(--volt);}
.action-btn.mark-paid{color:var(--green-ok); border-color:var(--green-ok);}
.wa-link{color:var(--bone-dim); text-decoration:underline;}

.empty-state{text-align:center; padding:60px 20px; color:var(--bone-dim);}
.sound-toggle{
  display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px;
  color:var(--bone-dim); cursor:pointer; margin-bottom:20px;
}
</style>
</head>
<body>

<div class="wrap" id="lockWrap">
  <div class="lock-screen">
    <h2>ORDERS <span style="color:var(--volt)">DASHBOARD</span></h2>
    <input type="password" id="pinInput" placeholder="ENTER PIN" maxlength="6">
    <button class="btn" onclick="tryLogin()">Unlock</button>
    <p style="font-size:12px; color:var(--bone-dim); margin-top:14px;">Default PIN: 1234 — change it in the code once deployed.</p>
  </div>
</div>

<div class="wrap" id="dashWrap" style="display:none;">
  <header>
    <div class="logo">NII <span class="accent">JERSEY</span> ORDERS</div>
    <div class="status-dot"><span class="dot"></span> Live</div>
  </header>

  <div class="stat-row">
    <div class="stat-box"><div class="num" id="totalOrders">0</div><div class="label">Total Orders</div></div>
    <div class="stat-box"><div class="num" id="unpaidOrders">0</div><div class="label">Awaiting Payment</div></div>
    <div class="stat-box"><div class="num" id="paidOrders">0</div><div class="label">Paid</div></div>
    <div class="stat-box"><div class="num" id="totalRevenue">GH₵0</div><div class="label">Paid Revenue</div></div>
  </div>

  <label class="sound-toggle">
    <input type="checkbox" id="soundToggle" checked>
    🔔 Play a sound when a new order comes in
  </label>

  <div id="ordersList"></div>
</div>

<script>
const ADMIN_PIN = "1234";
let firstLoad = true;
let knownOrderIds = new Set();

function tryLogin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    document.getElementById('lockWrap').style.display = 'none';
    document.getElementById('dashWrap').style.display = 'block';
    startListening();
  } else {
    alert('Incorrect PIN');
  }
}
document.getElementById('pinInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') tryLogin();
});

function money(n){ return 'GH₵' + Number(n||0).toLocaleString(); }

function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function waLink(phone, orderCode){
  const digits = phone.replace(/\D/g,'');
  const intl = digits.startsWith('0') ? '233' + digits.slice(1) : digits;
  const msg = encodeURIComponent(`Hi, this is Nii Jersey Center regarding your order ${orderCode}.`);
  return `https://wa.me/${intl}?text=${msg}`;
}

function renderOrders(orders){
  const list = document.getElementById('ordersList');

  document.getElementById('totalOrders').textContent = orders.length;
  const unpaid = orders.filter(o => !o.paid);
  const paid = orders.filter(o => o.paid);
  document.getElementById('unpaidOrders').textContent = unpaid.length;
  document.getElementById('paidOrders').textContent = paid.length;
  document.getElementById('totalRevenue').textContent = money(paid.reduce((s,o)=>s+(o.grandTotal||0),0));

  if(orders.length === 0){
    list.innerHTML = `<div class="empty-state">No orders yet. New orders will appear here instantly.</div>`;
    return;
  }

  list.innerHTML = orders.map(o => {
    const isNew = !firstLoad && !knownOrderIds.has(o.orderCode);
    const itemsHtml = (o.items||[]).map(it => `<div>${it.qty} × ${it.name} — ${money(it.price*it.qty)}</div>`).join('');
    return `
      <div class="order-card ${o.paid ? 'paid':'unpaid'} ${isNew ? 'new-flash':''}">
        <div class="order-top">
          <div>
            <div class="order-code">${o.orderCode}</div>
            <div class="order-time">${timeAgo(o.createdAt)}</div>
          </div>
          <div class="order-status ${o.paid ? 'paid':'unpaid'}">${o.paid ? '✓ Paid' : 'Awaiting Payment'}</div>
        </div>
        <div class="order-customer">${o.name}</div>
        <div class="order-detail">📞 ${o.phone} — <a class="wa-link" href="${waLink(o.phone, o.orderCode)}" target="_blank">Message on WhatsApp</a></div>
        <div class="order-detail">📍 ${o.address}, ${o.city}, ${o.region}</div>
        <div class="order-detail">🚚 ${o.deliveryFeeLabel || o.deliveryZone || ''} — ${money(o.deliveryFee)}</div>
        <div class="order-items">${itemsHtml}</div>
        <div class="order-total-row"><span>Grand Total</span><span>${money(o.grandTotal)}</span></div>
        ${!o.paid ? `<div class="order-actions"><button class="action-btn mark-paid" onclick="markPaid('${o.orderCode}')">Mark as Paid</button></div>` : ''}
      </div>
    `;
  }).join('');

  orders.forEach(o => knownOrderIds.add(o.orderCode));
}

async function markPaid(orderCode){
  try{
    const { db, doc, updateDoc } = window.__fb;
    await updateDoc(doc(db, 'orders', orderCode), { paid: true, paidAt: new Date().toISOString() });
  }catch(e){ console.error('Failed to mark paid', e); alert('Could not update order — check your connection.'); }
}

function playAlert(){
  if(!document.getElementById('soundToggle').checked) return;
  try{
    const audio = document.getElementById('alertSound');
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }catch(e){}
}

function startListening(){
  const waitForFb = setInterval(() => {
    if(window.__fbReady){
      clearInterval(waitForFb);
      const { db, collection, onSnapshot, query, orderBy } = window.__fb;
      const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snapshot) => {
        const orders = snapshot.docs.map(d => d.data());
        const hasNewOrder = !firstLoad && orders.some(o => !knownOrderIds.has(o.orderCode));
        if(hasNewOrder) playAlert();
        renderOrders(orders);
        firstLoad = false;
      }, (err) => {
        console.error('Orders listener error', err);
        document.getElementById('ordersList').innerHTML = `<div class="empty-state">Could not load orders — check your connection and refresh.</div>`;
      });
    }
  }, 100);
}
</script>
</body>
</html>
